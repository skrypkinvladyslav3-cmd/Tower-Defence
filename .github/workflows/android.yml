name: Build
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        run: |
          # Приймаємо всі ліцензії через офіційний інструмент Android перед запуском
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          # Видаляємо старі хвости, якщо вони були
          rm -rf .buildozer/android/platform/android-sdk/licenses
          
          # Запускаємо збірку з прямим погодженням ліцензій
          yes | buildozer -v android debug
        env:
          # Ці налаштування змушують Gradle бути дуже тихим і не вилітати через пам'ять
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.vfs.watch=false"
          # Важливо для нових версій Buildozer
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerDefense-Game
          path: bin/*.apk
